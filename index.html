<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="고정식 교정장치 환자를 위한 구강관리 교육 가이드">
<title>BRACE CARE | 교정 중에도 건강한 치아를</title>
<style>
:root{
  --green:#477b68;--green-dark:#315e4e;--mint:#e4f0e8;--mint2:#f1f7f2;
  --blue:#e9f2f5;--yellow:#f7f2d9;--ink:#263a32;--muted:#718078;
  --line:#e3ebe5;--white:#fff;--shadow:0 12px 32px rgba(49,94,78,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f8faf8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;background:rgba(248,250,248,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-weight:900;letter-spacing:1.5px;color:var(--green);font-size:19px}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-top:-4px}
.navlinks{display:flex;gap:5px;align-items:center}
.navlinks button{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:20px;font-size:13px}
.navlinks button.active,.navlinks button:hover{background:var(--mint);color:var(--green-dark)}
.menu-toggle{display:none;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 12px;color:var(--green)}
.hero{padding:56px 0 38px}
.hero-card{background:linear-gradient(120deg,#e6f1e8 0%,#edf5f3 58%,#f8f4df 100%);border-radius:28px;padding:42px 44px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:24px;overflow:hidden;position:relative}
.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--green)}
h1{font-size:clamp(32px,5vw,48px);line-height:1.2;margin:13px 0 14px;letter-spacing:-1.5px}
.hero p{color:#586d62;margin:0;max-width:490px}
.hero-art{min-height:205px;display:flex;align-items:center;justify-content:center;position:relative}
.tooth{width:170px;height:170px;border-radius:48% 48% 42% 42%;background:#fff;box-shadow:inset -9px -10px 0 #e7eee8,0 18px 35px #9bb8a455;display:flex;align-items:center;justify-content:center;font-size:76px;transform:rotate(-5deg)}
.spark{position:absolute;color:var(--green);font-size:26px}.s1{top:20px;left:12%}.s2{right:8%;top:35px;font-size:18px}.s3{bottom:18px;right:18%;font-size:30px}
.pill{display:inline-flex;align-items:center;background:#fff9;border:1px solid #fff;padding:6px 12px;border-radius:30px;font-size:11px;color:var(--green-dark);font-weight:700;margin-top:20px}
.section{padding:28px 0 48px;scroll-margin-top:85px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.kicker{font-size:11px;color:var(--green);font-weight:800;letter-spacing:1.5px}
h2{font-size:25px;margin:4px 0 0;letter-spacing:-.7px}
.sub{color:var(--muted);font-size:13px;margin:7px 0 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:var(--shadow);transition:.2s;cursor:pointer;text-align:left;width:100%;color:inherit}
.card:hover{transform:translateY(-3px);border-color:#b8d2c2}
.card-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;margin-bottom:14px;background:var(--mint)}
.card:nth-child(2) .card-icon{background:var(--blue)}.card:nth-child(3) .card-icon{background:var(--yellow)}.card:nth-child(4) .card-icon{background:#f4eaf0}
.card strong{display:block;font-size:16px;margin-bottom:5px}.card span{display:block;font-size:12px;color:var(--muted)}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info{background:white;border:1px solid var(--line);border-radius:20px;padding:22px}
.info h3{font-size:17px;margin:0 0 9px}.info p{font-size:13px;color:var(--muted);margin:0}
.callout{background:var(--mint2);border-left:4px solid #8bb49a;padding:14px 16px;border-radius:0 12px 12px 0;margin-top:16px;font-size:13px}
.topic{display:none;scroll-margin-top:90px}.topic.active{display:block}
.topic-hero{background:var(--mint);border-radius:22px;padding:25px 28px;margin-bottom:18px}
.topic-hero .num{font-size:11px;color:var(--green);font-weight:800;letter-spacing:1.5px}
.topic-hero h2{font-size:27px;margin:5px 0}
.topic-hero p{margin:0;color:#5d7468;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:17px;padding:19px}
.step b{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:8px}
.step-no{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--mint);color:var(--green);font-size:12px}
.step p,.step li{font-size:13px;color:var(--muted)}
.step ul{padding-left:18px;margin:8px 0 0}
.video-placeholder{margin-top:16px;background:#f1f5f2;border:1px dashed #a9c5b3;border-radius:17px;min-height:145px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--green)}
.video-placeholder strong{display:block;font-size:14px}.video-placeholder span{font-size:12px;color:var(--muted)}
.notice{font-size:12px;color:var(--muted);background:#fbf7e7;border-radius:13px;padding:13px 15px;margin-top:16px}
.brush-check{background:white;border:1px solid var(--line);border-radius:20px;padding:22px}
.brush-item{display:grid;grid-template-columns:28px 1fr;gap:11px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.brush-item:last-child{border-bottom:0}
.brush-item input{width:19px;height:19px;margin-top:3px;accent-color:var(--green)}
.brush-item strong{display:block;font-size:14px;margin-bottom:3px}
.brush-item span{display:block;color:var(--muted);font-size:12px}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:17px}
.part{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}
.part strong{display:block;color:var(--green-dark);font-size:14px;margin-bottom:4px}
.part span{font-size:12px;color:var(--muted)}
@media(max-width:760px){.parts{grid-template-columns:1fr}}
.primary{background:var(--green);color:white;border:0;border-radius:24px;padding:11px 19px;font-weight:700;font-size:13px;margin-top:15px}
.primary:hover{background:var(--green-dark)}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.checkitem{display:flex;gap:10px;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:13px}
.checkitem input{accent-color:var(--green);width:17px;height:17px}
.progress{height:7px;background:#e9efea;border-radius:9px;overflow:hidden;margin-top:14px}.progress div{height:100%;background:#7eaa8e;width:0;transition:.2s}
footer{background:#edf3ee;padding:28px 0;margin-top:25px;color:var(--muted);font-size:11px}
footer strong{color:var(--green-dark);font-size:14px}
.hidden{display:none!important}
@media(max-width:760px){
 .nav{height:62px}.menu-toggle{display:block}.navlinks{display:none;position:absolute;top:61px;left:0;right:0;background:#f8faf8;padding:12px 20px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.navlinks.open{display:flex}.navlinks button{font-size:12px}
 .hero{padding:25px 0}.hero-card{grid-template-columns:1fr;padding:29px 25px;gap:0}.hero-art{min-height:140px}.tooth{width:120px;height:120px;font-size:55px}
 .cards{grid-template-columns:repeat(2,1fr)}.content-grid,.steps{grid-template-columns:1fr}.section{padding:22px 0 35px}.section-head{align-items:start;flex-direction:column}
 .checklist{grid-template-columns:1fr}.wrap{padding:0 17px}
}
</style>
</head>
<body>
<header>
 <div class="wrap nav">
  <a class="brand" href="#" onclick="showHome();return false">BRACE CARE<small>ORTHODONTIC ORAL CARE GUIDE</small></a>
  <button class="menu-toggle" onclick="document.querySelector('.navlinks').classList.toggle('open')">메뉴 ☰</button>
  <nav class="navlinks" aria-label="주 메뉴">
   <button class="active" data-page="home" onclick="navigate('home')">HOME</button>
   <button data-page="why" onclick="navigate('why')">관리의 중요성</button>
   <button data-page="brush" onclick="navigate('brush')">칫솔질</button>
   <button data-page="tools" onclick="navigate('tools')">보조 구강관리</button>
   <button data-page="life" onclick="navigate('life')">식습관</button>
   <button data-page="check" onclick="navigate('check')">양치 체크</button>
  </nav>
 </div>
</header>
<main class="wrap"><div id="site-content"><div class="info">콘텐츠를 불러오는 중입니다…</div></div></main>
<script>
const pages=['why','brush','tools','life','check'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lines(v){return esc(v).replace(/\r?\n/g,'<br>');}
function videoEmbed(url,title,desc){
 if(!url) return `<div class="video-placeholder"><div><div style="font-size:30px">▶</div><strong>${esc(title||'교육 영상')}</strong><span>${esc(desc||'영상 주소를 CMS에서 입력하면 여기에 표시됩니다.')}</span></div></div>`;
 let u=url.trim(), embed='';
 const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/);
 if(yt) embed=`https://www.youtube-nocookie.com/embed/${yt[1]}`;
 if(embed) return `<div class="video-placeholder" style="padding:0;overflow:hidden"><iframe src="${esc(embed)}" title="${esc(title||'교육 영상')}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen loading="lazy"></iframe></div>`;
 if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(u)) return `<div class="video-placeholder" style="padding:0;overflow:hidden"><video controls playsinline style="width:100%;max-height:480px" src="${esc(u)}">브라우저가 영상을 지원하지 않습니다.</video></div>`;
 return `<div class="video-placeholder"><div><strong>${esc(title||'교육 영상')}</strong><span>지원되는 YouTube 또는 MP4/WebM/OGG 영상 주소를 입력해 주세요.</span><a href="${esc(u)}" target="_blank" rel="noopener">영상 링크 열기</a></div></div>`;
}
function renderStep(s,i){return `<article class="step"><b><span class="step-no">${i+1}</span>${esc(s.title)}</b><p>${lines(s.text)}</p>${Array.isArray(s.bullets)&&s.bullets.length?`<ul>${s.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</article>`;}
function renderSection(s){let h=`<section id="${esc(s.id)}" class="topic"><div class="topic-hero"><div class="num">${esc(s.number)}</div><h2>${esc(s.title)}</h2><p>${lines(s.intro)}</p></div>`;
 if(s.subheading) h+=`<h3 style="margin:20px 0 8px">${esc(s.subheading)}</h3>`;
 if(s.description) h+=`<p class="sub">${lines(s.description)}</p>`;
 if(s.image) h+=`<div style="margin:18px 0;text-align:center"><img src="${esc(s.image)}" alt="${esc(s.image_alt||s.title)}" style="max-width:100%;height:auto;border-radius:18px"></div>`;
 if(s.blocks?.length) h+=`<div class="parts">${s.blocks.map(b=>`<div class="part"><strong>${esc(b.title)}</strong><span>${lines(b.text)}</span></div>`).join('')}</div>`;
 if(s.id==='check'){
 h+=`<div class="brush-check"><h3 style="margin:0 0 5px">🪥 ${esc(s.check_title||'단계별 확인')}</h3><p class="sub">${lines(s.check_description||'한 항목씩 확인해 보세요.')}</p><div id="brush-list">${(s.steps||[]).map((x,i)=>`<label class="brush-item"><input type="checkbox"><span><strong>${i+1}. ${esc(x.title)}</strong><span>${lines(x.text)}</span></span></label>`).join('')}</div><div class="progress"><div id="progress-fill"></div></div><p id="progress-text" class="sub">0 / ${(s.steps||[]).length}단계 확인</p><button class="primary" onclick="resetBrushChecklist()">체크리스트 초기화</button></div>`;
 } else if(s.steps?.length) h+=`<div class="steps">${s.steps.map(renderStep).join('')}</div>`;
 if(s.video_title) h+=videoEmbed(s.video_url,s.video_title,s.video_description);
 if(s.callout) h+=`<div class="callout">${lines(s.callout)}</div>`;
 if(s.notice) h+=`<div class="notice">${lines(s.notice)}</div>`;
 if(s.reminder_text) h+=`<div class="info" style="margin-top:18px"><h3>${esc(s.reminder_title||'잊지 마세요')}</h3><p>${lines(s.reminder_text)}</p><button class="primary" onclick="navigate('tools')">보조 구강관리 방법 보기 →</button></div>`;
 return h+'</section>';
}
function renderSite(d){const h=d.home||{},cards=d.cards||[],sections=d.sections||[],f=d.footer||{};
 let html=`<div id="home"><section class="hero"><div class="hero-card"><div><div class="eyebrow">${esc(h.eyebrow)}</div><h1>${lines(h.title)}</h1><p>${lines(h.description)}</p><span class="pill">${esc(h.pill)}</span></div><div class="hero-art" aria-hidden="true"><span class="spark s1">✦</span><span class="spark s2">✧</span><div class="tooth">😁</div><span class="spark s3">✦</span></div></div></section>
 <section class="section"><div class="section-head"><div><div class="kicker">START HERE</div><h2>${esc(h.section_title)}</h2><p class="sub">${lines(h.section_description)}</p></div></div><div class="cards">${cards.map(c=>`<button class="card" onclick="navigate('${esc(c.page)}')"><div class="card-icon">${esc(c.icon)}</div><strong>${esc(c.title)}</strong><span>${esc(c.description)}</span></button>`).join('')}</div></section>
 <section class="section"><div class="section-head"><div><div class="kicker">DAILY ROUTINE</div><h2>${esc(h.routine_title)}</h2><p class="sub">${lines(h.routine_description)}</p></div></div><div class="content-grid"><div class="info"><h3>📋 ${esc(h.routine_card_title)}</h3><p>${lines(h.routine_card_text)}</p><button class="primary" onclick="navigate('check')">체크리스트 확인하기 →</button></div><div class="info"><h3>💡 ${esc(h.tip_title)}</h3><p>${lines(h.tip_text)}</p><div class="callout">${lines(h.tip_notice)}</div></div></div></section></div>`;
 html+=sections.map(renderSection).join('');
 html+=`<footer><div class="wrap"><strong>${esc(f.title)}</strong><p>${lines(f.subtitle)}</p><p>${lines(f.disclaimer)}</p><p>${esc(f.copyright)}</p></div></footer>`;
 document.getElementById('site-content').innerHTML=html;
}
function navigate(id){document.getElementById('home').classList.toggle('hidden',id!=='home');pages.forEach(p=>{const el=document.getElementById(p);if(el)el.classList.toggle('active',p===id)});document.querySelectorAll('.navlinks button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.querySelector('.navlinks').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
function showHome(){navigate('home')}
function updateBrushProgress(){const checks=[...document.querySelectorAll('#brush-list input')];const n=checks.filter(x=>x.checked).length;const fill=document.getElementById('progress-fill');const text=document.getElementById('progress-text');if(fill)fill.style.width=(checks.length?n/checks.length*100:0)+'%';if(text)text.textContent=n+' / '+checks.length+'단계 확인';}
function resetBrushChecklist(){document.querySelectorAll('#brush-list input').forEach(x=>x.checked=false);updateBrushProgress()}
document.addEventListener('change',e=>{if(e.target.matches('#brush-list input'))updateBrushProgress()});
fetch('./content/site.json').then(r=>{if(!r.ok)throw new Error('site.json을 불러오지 못했습니다.');return r.json()}).then(renderSite).catch(e=>{document.getElementById('site-content').innerHTML='<div class="info">홈페이지 콘텐츠를 불러오지 못했습니다. content/site.json 파일과 배포 경로를 확인해 주세요.</div>';console.error(e)});
</script>
</body>
</html>
