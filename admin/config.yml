backend:
  name: github
  repo: hayoung03-cyber/brace-care
  branch: cms-integration

site_url: https://preventive-dentistry-project08.netlify.app
display_url: https://preventive-dentistry-project08.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ko"

collections:
  - name: "brace_content"
    label: "BRACE CARE 콘텐츠"
    files:
      - name: "site"
        label: "홈페이지 전체 콘텐츠"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "홈 화면"
            name: "home"
            widget: "object"
            fields:
              - { label: "상단 문구", name: "eyebrow", widget: "string" }
              - { label: "메인 제목", name: "headline", widget: "text" }
              - { label: "소개 문구", name: "description", widget: "text" }
              - { label: "하단 라벨", name: "pill", widget: "string" }
              - { label: "주제 카드 제목", name: "cardsTitle", widget: "string" }
              - { label: "주제 카드 설명", name: "cardsSubtitle", widget: "text" }
              - { label: "일상 관리 제목", name: "routineTitle", widget: "string" }
              - { label: "일상 관리 설명", name: "routineSubtitle", widget: "text" }
              - { label: "체크 안내", name: "routineText", widget: "text" }
              - { label: "기억할 내용", name: "rememberText", widget: "text" }
              - { label: "안내 문구", name: "callout", widget: "text" }
          - label: "관리의 중요성"
            name: "why"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "소개", name: "description", widget: "text" }
              - { label: "장치 구성 제목", name: "partsTitle", widget: "string" }
              - { label: "장치 구성 안내", name: "partsSubtitle", widget: "text" }
              - label: "교정장치 구성 요소"
                name: "parts"
                widget: "list"
                fields:
                  - { label: "명칭", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
              - label: "구강관리 중요성"
                name: "reasons"
                widget: "list"
                fields:
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
              - { label: "핵심 문구", name: "callout", widget: "text" }
          - label: "올바른 칫솔질"
            name: "brush"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "소개", name: "description", widget: "text" }
              - label: "칫솔질 단계"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "단계 제목", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
              - { label: "영상 제목", name: "videoTitle", widget: "string" }
              - { label: "영상 설명", name: "videoDescription", widget: "text" }
              - { label: "영상 주소", name: "videoUrl", widget: "string", required: false }
              - { label: "주의 문구", name: "notice", widget: "text" }
          - label: "보조 구강관리"
            name: "tools"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "소개", name: "description", widget: "text" }
              - label: "보조용품"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "용품명", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
                  - { label: "사용 방법", name: "bullets", widget: "list", required: false, field: { label: "항목", name: "item", widget: "string" } }
              - { label: "영상 제목", name: "videoTitle", widget: "string" }
              - { label: "영상 설명", name: "videoDescription", widget: "text" }
              - { label: "영상 주소", name: "videoUrl", widget: "string", required: false }
          - label: "식습관 및 생활관리"
            name: "life"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "소개", name: "description", widget: "text" }
              - label: "생활관리 항목"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "항목 제목", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
              - { label: "안내 문구", name: "callout", widget: "text" }
          - label: "칫솔질 체크리스트"
            name: "check"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "소개", name: "description", widget: "text" }
              - { label: "체크리스트 제목", name: "listTitle", widget: "string" }
              - { label: "체크리스트 안내", name: "listSubtitle", widget: "text" }
              - label: "체크 항목"
                name: "items"
                widget: "list"
                fields:
                  - { label: "항목 제목", name: "title", widget: "string" }
                  - { label: "설명", name: "description", widget: "text" }
              - { label: "주의 문구", name: "notice", widget: "text" }
              - { label: "추가 안내 제목", name: "reminderTitle", widget: "string" }
              - { label: "추가 안내", name: "reminderText", widget: "text" }
          - label: "하단 영역"
            name: "footer"
            widget: "object"
            fields:
              - { label: "브랜드명", name: "title", widget: "string" }
              - { label: "부제목", name: "subtitle", widget: "string" }
              - { label: "면책 안내", name: "disclaimer", widget: "text" }
              - { label: "저작권 문구", name: "copyright", widget: "string" }
