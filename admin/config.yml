
backend:
  name: github
  repo: hayoung03-cyber/brace-care
  branch: main

site_url: https://preventive-dentistry-project08.netlify.app
display_url: https://preventive-dentistry-project08.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "ko"

collections:
  - name: "pages"
    label: "페이지 콘텐츠"
    files:
      - name: "home"
        label: "홈페이지 콘텐츠"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "홈페이지 제목"
            name: "title"
            widget: "string"

          - label: "홈페이지 소개"
            name: "intro"
            widget: "text"

          - label: "교정장치 관리"
            name: "appliance"
            widget: "object"
            fields:
              - label: "제목"
                name: "title"
                widget: "string"
              - label: "설명"
                name: "description"
                widget: "text"
              - label: "이미지"
                name: "image"
                widget: "image"
                required: false

          - label: "교육 영상 주소"
            name: "video_url"
            widget: "string"
            required: false
