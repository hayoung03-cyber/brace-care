backend:
  name: github
  repo: hayoung03-cyber/brace-care
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
media_folder: images/uploads
public_folder: /images/uploads
collections:
- name: pages
  label: 페이지 콘텐츠
  files:
  - name: site
    label: 홈페이지 콘텐츠
    file: content/site.json
    format: json
    fields:
    - label: 홈페이지
      name: home
      widget: object
      fields:
      - label: 상단 영문 문구
        name: eyebrow
        widget: string
      - label: 메인 제목
        name: title
        widget: string
      - label: 소개 문구
        name: description
        widget: text
      - label: 하단 라벨
        name: pill
        widget: string
      - label: 주제 선택 제목
        name: section_title
        widget: string
      - label: 주제 선택 설명
        name: section_description
        widget: text
      - label: 일상 관리 제목
        name: routine_title
        widget: string
      - label: 일상 관리 설명
        name: routine_description
        widget: text
      - label: 관리 카드 제목
        name: routine_card_title
        widget: string
      - label: 관리 카드 내용
        name: routine_card_text
        widget: text
      - label: 안내 카드 제목
        name: tip_title
        widget: string
      - label: 안내 카드 내용
        name: tip_text
        widget: text
      - label: 주의 문구
        name: tip_notice
        widget: text
    - label: 홈페이지 주제 카드
      name: cards
      widget: list
      fields:
      - label: 아이콘
        name: icon
        widget: string
      - label: 제목
        name: title
        widget: string
      - label: 설명
        name: description
        widget: string
      - label: 연결 페이지
        name: page
        widget: select
        options:
        - why
        - brush
        - tools
        - life
    - label: 상세 페이지
      name: sections
      widget: list
      summary: '{{fields.title}}'
      fields:
      - label: 페이지 ID (변경 금지)
        name: id
        widget: hidden
      - label: 번호 및 영문 라벨
        name: number
        widget: string
      - label: 페이지 제목
        name: title
        widget: string
      - label: 소개 문구
        name: intro
        widget: text
      - label: 자유 배치 콘텐츠 (추가·순서 이동 가능)
        name: content_blocks
        widget: list
        required: false
        summary: '{{fields.type}}'
        types:
        - label: 제목
          name: heading
          widget: object
          fields:
          - label: 제목
            name: title
            widget: string
        - label: 본문 텍스트
          name: text
          widget: object
          fields:
          - label: 내용
            name: text
            widget: text
        - label: 이미지
          name: image
          widget: object
          fields:
          - label: 사진 업로드
            name: image
            widget: image
          - label: 대체 설명 (접근성)
            name: alt
            widget: string
            required: false
          - label: 사진 아래 설명
            name: caption
            widget: string
            required: false
          - label: 이미지 크기
            name: size
            widget: select
            options:
            - label: 넓게
              value: wide
            - label: 보통
              value: medium
            - label: 작게
              value: small
            default: wide
        - label: 영상
          name: video
          widget: object
          fields:
          - label: 영상 제목
            name: title
            widget: string
            required: false
          - label: 영상 설명
            name: description
            widget: text
            required: false
          - label: YouTube 또는 MP4/WebM/OGG 주소
            name: url
            widget: string
            required: false
        - label: 정보 카드 모음
          name: cards
          widget: object
          fields:
          - label: 카드 목록
            name: items
            widget: list
            fields:
            - label: 카드 제목
              name: title
              widget: string
            - label: 카드 내용
              name: text
              widget: text
        - label: 단계별 설명 카드
          name: steps
          widget: object
          fields:
          - label: 단계 목록
            name: items
            widget: list
            fields:
            - label: 단계 제목
              name: title
              widget: string
            - label: 설명
              name: text
              widget: text
            - label: 세부 항목
              name: bullets
              widget: list
              required: false
              field:
                label: 항목
                name: item
                widget: string
        - label: 강조 문구
          name: callout
          widget: object
          fields:
          - label: 내용
            name: text
            widget: text
        - label: 주의 안내
          name: notice
          widget: object
          fields:
          - label: 내용
            name: text
            widget: text
        - label: 마무리 안내
          name: reminder
          widget: object
          fields:
          - label: 제목
            name: title
            widget: string
            required: false
          - label: 내용
            name: text
            widget: text
        typeKey: type
      - label: 체크리스트 제목 (양치 체크 페이지)
        name: check_title
        widget: string
        required: false
      - label: 체크리스트 설명 (양치 체크 페이지)
        name: check_description
        widget: text
        required: false
      - label: 체크리스트 단계 (양치 체크 페이지)
        name: steps
        widget: list
        required: false
        fields:
        - label: 단계 제목
          name: title
          widget: string
        - label: 내용
          name: text
          widget: text
    - label: 하단 안내
      name: footer
      widget: object
      fields:
      - label: 사이트 이름
        name: title
        widget: string
      - label: 설명
        name: subtitle
        widget: string
      - label: 면책 안내
        name: disclaimer
        widget: text
      - label: 저작권 문구
        name: copyright
        widget: string
